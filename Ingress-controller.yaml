apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotcha
  namespace: gotcha
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
  - host: gotcha.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gotcha-frontend-svc
            port:
              number: 80
