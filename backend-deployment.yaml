apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotcha-backend
  namespace: gotcha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gotcha-backend
  template:
    metadata:
      labels:
        app: gotcha-backend
    spec:
      containers:
      - name: backend
        image: 558050136406.dkr.ecr.eu-west-1.amazonaws.com/thbs-gotcha-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: gotcha-backend-svc
  namespace: gotcha
spec:
  selector:
    app: gotcha-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
