<div class="page-header min-vh-75">
  <div class="container">
    <div class="row">
      <div class="col-xl-4 col-lg-5 col-md-6 d-flex flex-column mx-auto">
        <div class="card card-plain mt-7">
          <div class="card-header pt-2 px-4 pb-0 text-left bg-transparent">
            <h3 class="font-weight-bolder text-info text-gradient m-0">
              Change Password
            </h3>
            <p class="m-0">Enter your email to change password</p>
          </div>
          <div class="card-body">
            <form [formGroup]="forgetPasswordForm">
              <div class="form-group">
                <label>Email</label>
                <input
                  [class.is-invalid]="username?.invalid && username?.touched"
                  [class.is-valid]="username?.valid"
                  type="email"
                  class="form-control"
                  formControlName="username"
                />
                <div *ngIf="username?.invalid && username?.touched">
                  <small
                    class="text-danger"
                    *ngIf="username?.errors?.['required']"
                  >
                    Email is required
                  </small>
                  <small
                    class="text-danger"
                    *ngIf="username?.errors?.['pattern']"
                  >
                    Enter a valid email address
                  </small>
                </div>
              </div>

              <div class="text-center">
                <button
                  type="submit"
                  (click)="submitForgetPassword()"
                  [disabled]="username.invalid"
                  class="btn bg-gradient-info w-100 mt-4 mb-0"
                >
                  Reset Password
                </button>
              </div>
              <div class="text-success row">
                <p>{{ successMessage }}</p>
              </div>
              <div class="text-danger row">
                <p>{{ failureMessage }}</p>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div
          class="oblique position-absolute top-0 h-100 d-md-block d-none me-n8"
        >
          <img src="{{ bgImgUrl }}" />
        </div>
      </div>
    </div>
  </div>
</div>
