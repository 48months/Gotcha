<div class="page-header min-vh-75">
  <div class="container">
    <div class="row">
      <div class="col-xl-4 col-lg-5 col-md-6 d-flex flex-column mx-auto">
        <div class="card card-plain mt-7">
          <div class="card-header pt-2 px-4 pb-0 text-left bg-transparent">
            <h3 class="font-weight-bolder text-info text-gradient m-0">
              Change Password
            </h3>
            <p class="m-0">Enter your changing password</p>
          </div>
          <div class="card-body">
            <form [formGroup]="resetPasswordForm">
              <div class="form-group">
                <label>Password</label>
                <input
                  [class.is-invalid]="password?.invalid && password?.touched"
                  [class.is-valid]="password?.valid"
                  type="password"
                  class="form-control"
                  formControlName="password"
                />
                <div *ngIf="password?.invalid && password?.touched">
                  <small
                    class="text-danger"
                    *ngIf="password?.errors?.['required']"
                    >Password is required</small
                  >
                  <small
                    class="text-danger"
                    *ngIf="password?.errors?.['minlength']"
                  >
                    Password must be at least 3 characters
                  </small>
                  <small
                    class="text-danger"
                    *ngIf="password?.errors?.['maxlength']"
                  >
                    Password must not exceed 20 characters
                  </small>
                </div>
              </div>

              <div class="form-group">
                <label>Confirm Password</label>

                <input
                  [class.is-invalid]="
                    confirmPassword?.touched &&
                    (confirmPassword?.invalid ||
                      password.value !== confirmPassword.value)
                  "
                  [class.is-valid]="
                    confirmPassword?.valid &&
                    password.value === confirmPassword.value
                  "
                  type="password"
                  class="form-control"
                  formControlName="confirmPassword"
                />

                <div
                  *ngIf="
                    confirmPassword?.touched &&
                    (confirmPassword?.invalid ||
                      password.value !== confirmPassword.value)
                  "
                >
                  <small
                    class="text-danger"
                    *ngIf="confirmPassword?.errors?.['required']"
                  ></small>
                  <small
                    class="text-danger"
                    *ngIf="password?.errors?.['minlength']"
                  >
                  </small>
                  <small
                    class="text-danger"
                    *ngIf="password?.errors?.['maxlength']"
                  ></small>

                  <small
                    class="text-danger"
                    *ngIf="password.value !== confirmPassword.value"
                  >
                    Password do not match
                  </small>
                </div>
              </div>

              <div class="text-center">
                <button
                  type="submit"
                  (click)="submitResetPassword()"
                  [disabled]="
                    password.invalid ||
                    confirmPassword.invalid ||
                    password.value !== confirmPassword.value
                  "
                  class="btn bg-gradient-info w-100 mt-4 mb-0"
                >
                  Update Password
                </button>
              </div>
              <div *ngIf="successMessage" class="text-success">
                <p>{{ successMessage }}</p>
              </div>
              <div *ngIf="failureMessage" class="text-danger">
                <p>{{ failureMessage }}</p>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div
          class="oblique position-absolute top-0 h-100 d-md-block d-none me-n8"
        >
          <img src="{{ bgImgUrl }}" />
        </div>
      </div>
    </div>
  </div>
</div>
