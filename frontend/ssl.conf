server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html/frontend;

    location / {
       root /usr/share/nginx/html/frontend;
       index index.html;
       try_files $uri $uri/ /index.html;
    }

    # proxy - Panda BE
    location /public/ {
        proxy_pass http://gotcha-backend-svc:8080/public/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }

    location /protected/ {
        proxy_pass http://gotcha-backend-svc:8080/protected/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }

    location /admin/ {
        proxy_pass http://gotcha-backend-svc:8080/admin/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }


}

